name: Spring Boot App CI/CD

on:
  workflow_dispatch:

jobs:
  CICD:
    runs-on: ubuntu-latest

    steps:
    - name: Print GH Variable
      run: echo ${{ vars.DOMAIN }}

    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Snyk CLI
      run: npm install -g snyk

    # Eliminamos el paso "snyk auth" porque el token se pasa directamente en el test
    - name: Run Snyk test (JSON + SARIF)
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        mkdir -p snyk-reports
        # JSON report
        snyk test \
          --all-projects \
          --json-file-output=snyk-reports/snyk-java-deps.json \
          || true
        # SARIF report
        snyk test \
          --all-projects \
          --sarif-file-output=snyk-reports/snyk-java-deps.sarif \
          || true

    - name: Upload Snyk reports (artifacts)
      uses: actions/upload-artifact@v4
      with:
          name: snyk-reports
          path: snyk-reports/
          if-no-files-found: error
          retention-days: 14
    
    - name: Build with Maven
      run: mvn clean package
