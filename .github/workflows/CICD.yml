name: CI/CD Pipeline Spring Boot - EV3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: CONSTRUCCIÓN, PRUEBAS Y CUMPLIMIENTO EN LA NUBE DE GITHUB
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requisito indispensable para que SonarCloud analice todo el historial

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Ejecución de pruebas unitarias
      - name: Run Unit Tests (JUnit)
        run: mvn test

      # Escaneo de dependencias heredado de tu EV2
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects || true

      # POLÍTICAS DE CUMPLIMIENTO Y BLOQUEO (IE5 e IE6)
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Si SonarCloud detecta fallas críticas, este paso falla y el pipeline se detiene aquí.
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=TU_PROJECT_KEY_AQUI

  # JOB 2: CONSTRUCCIÓN DE IMAGEN Y SUBIDA A DOCKER HUB
  docker-publish:
    needs: build-and-audit # Solo se ejecuta si el código pasó la auditoría de SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spring-app-duoc:latest, ${{ secrets.DOCKER_USERNAME }}/spring-app-duoc:${{ github.sha }}

  # JOB 3: DESPLIEGUE EN RANCHER DESKTOP LOCAL (IE2)
  deploy-local:
    needs: docker-publish
    runs-on: self-hosted # Este es el puente: GitHub le dice a tu PC que ejecute esto
    steps:
      - name: Deploy to Local Kubernetes (Rancher Desktop)
        run: |
          # Actualiza la imagen en tu clúster local con la nueva versión
          kubectl set image deployment/spring-app spring-app=${{ secrets.DOCKER_USERNAME }}/spring-app-duoc:${{ github.sha }}
          kubectl rollout status deployment/spring-app

