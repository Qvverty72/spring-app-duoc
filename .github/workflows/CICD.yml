name: Full CI/CD Pipeline Spring Boot

on:
  workflow_dispatch: # Permite ejecución manual
  push:
    branches: [ "main" ] # Se ejecuta al subir cambios a main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    # 1. Configuración de Java
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 2. EJECUCIÓN DE PRUEBAS UNITARIAS (IE2)
    - name: Run Unit Tests (JUnit)
      run: mvn test

    # 3. ESCANEO DE DEPENDENCIAS (IE3)
    - name: Install Snyk CLI
      run: npm install -g snyk

    - name: Snyk Security Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        snyk test --all-projects || true

    # 4. CONSTRUCCIÓN DE IMAGEN DOCKER (IE1)
    - name: Build Docker Image
      run: |
        docker build -t spring-app-duoc:latest .
        docker tag spring-app-duoc:latest spring-app-duoc:${{ github.sha }}

    # 5. DESPLIEGUE AUTOMÁTICO EN ENTORNO SIMULADO (IE4)
    - name: Deploy to Simulated Environment (Docker Compose)
      run: |
        # Usamos el docker-compose.yml que creamos anteriormente
        docker compose up -d
        echo "Despliegue simulado completado con éxito"
        docker ps